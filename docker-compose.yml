services:
  rdf_create_tools:
    container_name: rdf_create_tools
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ${DATA_SOURCE_DIRECTORY:-./data/source}:/data/source
      - ${RDF_DATA_DIRECTORY:-./data/rdf}:/data/rdf
      - ./scripts/config.ini:/app/config.ini